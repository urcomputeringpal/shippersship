name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent "build/Shippers Ship.app" "ShippersShip-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "ShippersShip-${GITHUB_REF_NAME}.zip" > "ShippersShip-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ShippersShip-${GITHUB_REF_NAME}.zip" "ShippersShip-${GITHUB_REF_NAME}.zip.sha256" --generate-notes
